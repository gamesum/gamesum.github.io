<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Thank You | AFTERGLO Lighting</title>
  <link rel="icon" type="image/png" href="afterglo-favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #17171B;
      --bg2:      #1B1B1F;
      --bg3:      #232328;
      --accent:   #D4A43A;
      --accent2:  #d4a843;
      --text:     #F2F2F4;
      --muted:    #ADADB6;
      --border:   #2E2E34;
      --radius:   12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2 { font-family: 'Outfit', sans-serif; line-height: 1.15; }
    a { text-decoration: none; color: inherit; }

    header {
      padding: 24px;
      text-align: center;
    }
    .logo {
      display: inline-block;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .logo span { color: var(--accent); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 56px 40px;
    }

    .check {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(212,164,58,0.12);
      border: 1px solid rgba(212,164,58,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: scale(0);
      animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s forwards;
    }
    .check svg {
      color: var(--accent);
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: checkDraw 0.4s ease-out 0.55s forwards;
    }
    @keyframes checkPop {
      0%   { transform: scale(0); }
      100% { transform: scale(1); }
    }
    @keyframes checkDraw {
      to { stroke-dashoffset: 0; }
    }

    /* ─── CONFETTI ───────────────────────────────────────── */
    #confetti {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 50;
    }
    .confetti-piece {
      position: absolute;
      top: -20px;
      opacity: 0;
      animation-name: confettiFall, confettiFade;
      animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94), linear;
      animation-iteration-count: 1, 1;
      animation-fill-mode: forwards, forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); }
      100% { transform: translateY(105vh) translateX(var(--drift)) rotate(var(--spin)); }
    }
    @keyframes confettiFade {
      0%   { opacity: 1; }
      85%  { opacity: 1; }
      100% { opacity: 0; }
    }

    h1 {
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      color: #fff;
      margin-bottom: 12px;
    }

    .sub {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 380px;
      margin: 0 auto 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #0e0e0e;
      width: 100%;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(212,164,58,0.25); }

    .btn-secondary {
      margin-top: 16px;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .btn-secondary:hover { color: var(--text); }

    footer {
      text-align: center;
      padding: 24px;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="confetti"></div>
  <header>
    <a href="index.html" class="logo">AFTER<span>GLO</span></a>
  </header>

  <main>
    <div class="card">
      <div class="check">
        <svg width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M20 6L9 17l-5-5"/>
        </svg>
      </div>
      <h1>We Got Your Info!</h1>
      <p class="sub">Thanks for reaching out to AFTERGLO. We'll review your request and reach out soon — usually within one business day.</p>
      <a href="tel:+13853374144" class="btn btn-primary">Call Us Now: (385) 337-4144</a>
      <div>
        <a href="index.html" class="btn-secondary">← Back to afterglolighting.org</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; <span id="year"></span> AFTERGLO Lighting
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function() {
      const colors = ['#D4A43A', '#F0C04A', '#F2F2F4', '#e8963a', '#fff8e0'];
      const shapes = ['circle', 'rect'];
      const container = document.getElementById('confetti');
      const count = 90;

      for (let i = 0; i < count; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';

        const size = 6 + Math.random() * 8;
        const shape = shapes[Math.floor(Math.random() * shapes.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const left = Math.random() * 100;
        const drift = (Math.random() * 160 - 80) + 'px';
        const spin = (Math.random() * 720 - 360) + 'deg';
        const duration = 3.2 + Math.random() * 2.4;
        const delay = Math.random() * 2.5;

        piece.style.left = left + 'vw';
        piece.style.width = size + 'px';
        piece.style.height = (shape === 'rect' ? size * 0.4 : size) + 'px';
        piece.style.background = color;
        piece.style.borderRadius = shape === 'circle' ? '50%' : '2px';
        piece.style.setProperty('--drift', drift);
        piece.style.setProperty('--spin', spin);
        piece.style.animationDuration = duration + 's, ' + duration + 's';
        piece.style.animationDelay = delay + 's, ' + delay + 's';

        container.appendChild(piece);
      }

      setTimeout(() => { container.remove(); }, 7000);
    })();
  </script>
</body>
</html>
