<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFTERGLO — Yard Sign 18×12</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #444;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  .sign {
    width: 18in;
    height: 12in;
    background: #060a0f;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }

  /* ── background glow ── */
  .bg-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bg-glow-left {
    position: absolute;
    top: 50%; left: 25%;
    transform: translate(-50%, -50%);
    width: 10in; height: 10in;
    background: radial-gradient(ellipse, rgba(200,146,30,0.09) 0%, transparent 60%);
  }
  .bg-glow-right {
    position: absolute;
    top: 50%; left: 72%;
    transform: translate(-50%, -50%);
    width: 9in; height: 9in;
    background: radial-gradient(ellipse, rgba(200,146,30,0.055) 0%, transparent 60%);
  }

  /* ── corner marks ── */
  .sign::before, .sign::after,
  .corner-br, .corner-bl {
    content: '';
    position: absolute;
    width: 0.28in;
    height: 0.28in;
    border-color: rgba(200,146,30,0.3);
    border-style: solid;
    z-index: 10;
  }
  .sign::before { top: 0.2in;    left: 0.2in;   border-width: 1.5px 0 0 1.5px; }
  .sign::after  { top: 0.2in;    right: 0.2in;  border-width: 1.5px 1.5px 0 0; }
  .corner-br    { bottom: 0.2in; right: 0.2in;  border-width: 0 1.5px 1.5px 0; }
  .corner-bl    { bottom: 0.2in; left: 0.2in;   border-width: 0 0 1.5px 1.5px; }

  /* ── LEFT PANEL — brand ── */
  .left {
    width: 7.8in;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.7in 0.75in 0.7in 0.8in;
    position: relative;
    z-index: 1;
    gap: 0.22in;
  }

  .tagline-top {
    font-size: 0.2in;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(200,146,30,0.7);
  }

  .logo {
    font-size: 2.05in;
    font-weight: 900;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
  }
  .logo span {
    color: #c8921e;
    text-shadow:
      0 0 0.18in rgba(200,146,30,1),
      0 0 0.38in rgba(200,146,30,0.6),
      0 0 0.65in rgba(200,146,30,0.3);
  }

  .logo-rule {
    width: 100%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent 0%, #c8921e 25%, #c8921e 75%, transparent 100%);
    opacity: 0.5;
  }

  .sub-text {
    font-size: 0.18in;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  /* ── DIVIDER ── */
  .divider {
    width: 1.5px;
    margin: 0.55in 0;
    background: linear-gradient(180deg, transparent 0%, rgba(200,146,30,0.45) 20%, rgba(200,146,30,0.45) 80%, transparent 100%);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  /* ── RIGHT PANEL — call to action ── */
  .right {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0.7in 0.8in 0.7in 0.75in;
    position: relative;
    z-index: 1;
    gap: 0.3in;
  }

  .headline {
    font-size: 0.98in;
    font-weight: 900;
    line-height: 1.05;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    text-align: center;
  }
  .headline em {
    display: block;
    color: #c8921e;
    font-style: normal;
    text-shadow:
      0 0 0.14in rgba(200,146,30,0.9),
      0 0 0.3in  rgba(200,146,30,0.45);
  }

  .phone-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.1in;
  }

  .call-label {
    font-size: 0.165in;
    font-weight: 700;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  .phone {
    font-size: 0.72in;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #c8921e;
    text-shadow:
      0 0 0.1in rgba(200,146,30,0.8),
      0 0 0.25in rgba(200,146,30,0.4);
  }

  @media print {
    body { background: none; padding: 0; display: block; }
    .sign { box-shadow: none; }
  }

  @page {
    size: 18in 12in landscape;
    margin: 0;
  }
</style>
</head>
<body>

<div class="sign">
  <!-- corner marks -->
  <div class="corner-br"></div>
  <div class="corner-bl"></div>

  <!-- background glows -->
  <div class="bg-glow">
    <div class="bg-glow-left"></div>
    <div class="bg-glow-right"></div>
  </div>

  <!-- LEFT: brand -->
  <div class="left">
    <div class="tagline-top">Permanent LED Lighting</div>
    <div class="logo">AFTER<span>GLO</span></div>
    <div class="logo-rule"></div>
    <div class="sub-text">Permanent · Programmable · Professional</div>
  </div>

  <!-- divider -->
  <div class="divider"></div>

  <!-- RIGHT: headline + phone -->
  <div class="right">
    <div class="headline">Your Home,<br><em>Your Way.</em></div>
    <div class="phone-block">
      <div class="call-label">Call or Text for a Free Quote</div>
      <div class="phone">(385) 337-4144</div>
    </div>
  </div>

</div>

</body>
</html>
