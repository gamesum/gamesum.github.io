<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFTERGLO — Yard Sign 12×18</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px;
  }

  .sign {
    width: 12in;
    height: 18in;
    background: #060a0f;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 0.7in 0.65in 0.65in;
  }

  /* ── corner marks ── */
  .sign::before, .sign::after,
  .corner-br, .corner-bl {
    content: '';
    position: absolute;
    width: 0.25in;
    height: 0.25in;
    border-color: rgba(200,146,30,0.35);
    border-style: solid;
  }
  .sign::before { top: 0.18in; left: 0.18in; border-width: 1.5px 0 0 1.5px; }
  .sign::after  { top: 0.18in; right: 0.18in; border-width: 1.5px 1.5px 0 0; }
  .corner-br    { bottom: 0.18in; right: 0.18in; border-width: 0 1.5px 1.5px 0; }
  .corner-bl    { bottom: 0.18in; left: 0.18in;  border-width: 0 0 1.5px 1.5px; }

  /* ── ambient background glow ── */
  .bg-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bg-glow-top {
    position: absolute;
    top: -1in;
    left: 50%;
    transform: translateX(-50%);
    width: 9in;
    height: 7in;
    background: radial-gradient(ellipse at 50% 30%, rgba(200,146,30,0.11) 0%, transparent 65%);
  }
  .bg-glow-mid {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 10in;
    height: 6in;
    background: radial-gradient(ellipse at 50% 50%, rgba(200,146,30,0.055) 0%, transparent 60%);
  }

  /* ── top block ── */
  .top-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.18in;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 1.55in;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    line-height: 1;
  }
  .logo span {
    color: #c8921e;
    text-shadow:
      0 0 0.15in rgba(200,146,30,0.9),
      0 0 0.3in  rgba(200,146,30,0.55),
      0 0 0.55in rgba(200,146,30,0.25);
  }

  .logo-rule {
    width: 100%;
    height: 1.5px;
    background: linear-gradient(90deg, transparent 0%, #c8921e 20%, #c8921e 80%, transparent 100%);
    opacity: 0.55;
    margin-top: 0.05in;
  }

  .tagline-top {
    font-size: 0.195in;
    font-weight: 400;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(200,146,30,0.75);
  }

  /* ── LED arch SVG ── */
  .arch-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── headline block ── */
  .headline-block {
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .headline {
    font-size: 0.92in;
    font-weight: 900;
    line-height: 1.06;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }
  .headline em {
    display: block;
    color: #c8921e;
    font-style: normal;
    text-shadow:
      0 0 0.12in rgba(200,146,30,0.8),
      0 0 0.28in rgba(200,146,30,0.4);
  }

  .sub-rule {
    width: 1.2in;
    height: 1.5px;
    background: rgba(200,146,30,0.45);
    margin: 0.2in auto 0.18in;
  }

  .sub-text {
    font-size: 0.215in;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }

  /* ── bottom block ── */
  .bottom-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.12in;
    position: relative;
    z-index: 1;
    width: 100%;
  }

  .bottom-rule {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,146,30,0.3) 20%, rgba(200,146,30,0.3) 80%, transparent 100%);
    margin-bottom: 0.04in;
  }

  .phone {
    font-size: 0.58in;
    font-weight: 900;
    letter-spacing: 0.04em;
    color: #c8921e;
    text-shadow:
      0 0 0.1in rgba(200,146,30,0.7),
      0 0 0.22in rgba(200,146,30,0.35);
  }

  .call-label {
    font-size: 0.155in;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
  }

  /* ── LED dots on arch ── */
  .led { animation: ledPulse 2.8s ease-in-out infinite; }
  .led:nth-child(2)  { animation-delay: 0.22s; }
  .led:nth-child(3)  { animation-delay: 0.44s; }
  .led:nth-child(4)  { animation-delay: 0.66s; }
  .led:nth-child(5)  { animation-delay: 0.88s; }
  .led:nth-child(6)  { animation-delay: 1.1s;  }
  .led:nth-child(7)  { animation-delay: 1.32s; }
  .led:nth-child(8)  { animation-delay: 1.54s; }
  .led:nth-child(9)  { animation-delay: 1.32s; }
  .led:nth-child(10) { animation-delay: 1.1s;  }
  .led:nth-child(11) { animation-delay: 0.88s; }
  .led:nth-child(12) { animation-delay: 0.66s; }
  .led:nth-child(13) { animation-delay: 0.44s; }
  .led:nth-child(14) { animation-delay: 0.22s; }

  @keyframes ledPulse {
    0%,100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  @media print {
    body { background: none; padding: 0; display: block; }
    .sign { box-shadow: none; }
    .led { animation: none; opacity: 1; }
  }

  @page {
    size: 12in 18in;
    margin: 0;
  }
</style>
</head>
<body>

<div class="sign">
  <!-- corner marks -->
  <div class="corner-br"></div>
  <div class="corner-bl"></div>

  <!-- background glows -->
  <div class="bg-glow">
    <div class="bg-glow-top"></div>
    <div class="bg-glow-mid"></div>
  </div>

  <!-- top: logo -->
  <div class="top-block">
    <div class="tagline-top">Permanent LED Lighting</div>
    <div class="logo">AFTER<span>GLO</span></div>
    <div class="logo-rule"></div>
  </div>

  <!-- arch graphic -->
  <div class="arch-wrap">
    <svg viewBox="0 0 600 260" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:9.5in;max-width:100%">
      <!-- tube -->
      <path d="M 40,240 A 260,260 0 0,1 560,240"
        stroke="rgba(220,230,255,0.12)" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- glow halo on tube -->
      <path d="M 40,240 A 260,260 0 0,1 560,240"
        stroke="rgba(200,146,30,0.08)" stroke-width="40" fill="none" stroke-linecap="round"/>
      <!-- 14 LED dots evenly along the arch -->
      <!-- cx=300,cy=240,r=260 — angles from 180° to 0° in 13 steps -->
      <circle class="led" cx="40"  cy="240" r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="48"  cy="183" r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="72"  cy="131" r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="111" cy="87"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="161" cy="52"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="219" cy="27"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="300" cy="20"  r="9" fill="#fff"    filter="url(#gw)"/>
      <circle class="led" cx="381" cy="27"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="439" cy="52"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="489" cy="87"  r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="528" cy="131" r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="552" cy="183" r="9" fill="#c8921e" filter="url(#g)"/>
      <circle class="led" cx="560" cy="240" r="9" fill="#c8921e" filter="url(#g)"/>
      <!-- ground glow -->
      <ellipse cx="300" cy="248" rx="260" ry="10" fill="rgba(200,146,30,0.06)"/>
      <defs>
        <filter id="g" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="gw" x="-200%" y="-200%" width="500%" height="500%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>
  </div>

  <!-- headline -->
  <div class="headline-block">
    <div class="headline">Your Home,<br><em>Your Way.</em></div>
    <div class="sub-rule"></div>
    <div class="sub-text">Permanent · Programmable · Professional</div>
  </div>

  <!-- bottom: phone -->
  <div class="bottom-block">
    <div class="bottom-rule"></div>
    <div class="call-label">Call or Text for a Free Quote</div>
    <div class="phone">(385) 337-4144</div>
  </div>

</div>

</body>
</html>
