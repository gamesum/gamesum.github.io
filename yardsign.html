<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFTERGLO — Yard Sign 18×12</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .sign {
    width: 18in;
    height: 12in;
    background: #060a0f;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* ── background glow ── */
  .bg-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bg-glow-center {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    width: 16in; height: 10in;
    background: radial-gradient(ellipse, rgba(200,146,30,0.10) 0%, transparent 55%);
  }

  /* ── gold border ── */
  .sign::before {
    content: '';
    position: absolute;
    inset: 0.18in;
    border: 2px solid rgba(200,146,30,0.30);
    pointer-events: none;
    z-index: 5;
  }

  /* ── main layout stack ── */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0.55in 0.75in;
    gap: 0;
  }

  /* ── top tagline ── */
  .tagline-top {
    font-size: 0.26in;
    font-weight: 700;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(200,146,30,0.75);
    margin-bottom: 0.15in;
  }

  /* ── logo ── */
  .logo {
    font-size: 2.7in;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    line-height: 0.88;
    white-space: nowrap;
  }
  .logo span {
    color: #c8921e;
    text-shadow:
      0 0 0.15in rgba(200,146,30,1),
      0 0 0.35in rgba(200,146,30,0.55),
      0 0 0.6in rgba(200,146,30,0.25);
  }

  /* ── decorative rule under logo ── */
  .logo-rule {
    width: 14in;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,146,30,0.5) 15%, #c8921e 40%, #c8921e 60%, rgba(200,146,30,0.5) 85%, transparent 100%);
    margin-top: 0.22in;
    margin-bottom: 0.18in;
  }

  /* ── three-word tagline ── */
  .sub-text {
    font-size: 0.24in;
    font-weight: 700;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    margin-bottom: 0.42in;
  }

  /* ── headline slogan ── */
  .headline {
    font-size: 0.72in;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    margin-bottom: 0.28in;
  }
  .headline em {
    color: #c8921e;
    font-style: normal;
    text-shadow:
      0 0 0.08in rgba(200,146,30,0.9),
      0 0 0.22in rgba(200,146,30,0.4);
  }

  /* ── bottom CTA ── */
  .cta-rule {
    width: 10in;
    height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,146,30,0.30) 20%, rgba(200,146,30,0.30) 80%, transparent 100%);
    margin-bottom: 0.22in;
  }

  .call-label {
    font-size: 0.20in;
    font-weight: 700;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    margin-bottom: 0.08in;
  }

  .phone {
    font-size: 0.88in;
    font-weight: 900;
    letter-spacing: 0.05em;
    color: #c8921e;
    line-height: 1;
    text-shadow:
      0 0 0.1in rgba(200,146,30,0.8),
      0 0 0.28in rgba(200,146,30,0.35);
  }

  @media print {
    body { background: none; padding: 0; display: block; height: auto; overflow: visible; }
    .sign { box-shadow: none; zoom: 1 !important; transform: none !important; }
  }

  @page {
    size: 18in 12in landscape;
    margin: 0;
  }
</style>
</head>
<body>

<div class="sign">
  <!-- background glow -->
  <div class="bg-glow">
    <div class="bg-glow-center"></div>
  </div>

  <!-- all content in a single flex column -->
  <div class="content">
    <div class="tagline-top">Permanent LED Lighting</div>
    <div class="logo">AFTER<span>GLO</span></div>
    <div class="logo-rule"></div>
    <div class="sub-text">Permanent · Programmable · Professional</div>

    <div class="headline">Your Home, <em>Your Way.</em></div>

    <div class="cta-rule"></div>
    <div class="call-label">Call or Text for a Free Quote</div>
    <div class="phone">(385) 337-4144</div>
  </div>
</div>

<script>
  (function() {
    var GAP = 32;
    var SW  = 18 * 96;
    var SH  = 12 * 96;
    function fit() {
      var sign = document.querySelector('.sign');
      var s = Math.min(
        (window.innerWidth  - GAP) / SW,
        (window.innerHeight - GAP) / SH
      );
      sign.style.zoom = String(Math.min(s, 1));
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
