<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    display: inline-flex;
    align-items: center;
    padding: 10px 12px;
  }

  .logo {
    display: inline-flex;
    align-items: center;
    line-height: 1;
  }

  .logo-text {
    font-family: 'Arial Black', 'Helvetica Neue', sans-serif;
    font-weight: 900;
    font-size: 148px;
    letter-spacing: -3px;
    line-height: 1;
  }

  .after {
    color: white;
    -webkit-text-stroke: 9px black;
    paint-order: stroke fill;
  }

  .glo {
    color: #c8921e;
    -webkit-text-stroke: 0;
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="logo-text">
      <span class="after">AFTER</span><span class="glo">GLO</span>
    </span>
  </div>
</body>
</html>
