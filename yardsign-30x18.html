<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AFTERGLO — Yard Sign 30×18</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #2a2a2a;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .sign-wrap {
    background: #000;
    padding: 0.5in;
  }

  .sign {
    width: 30in;
    height: 18in;
    background: #060a0f;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  /* ── background glow ── */
  .bg-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .bg-glow-center {
    position: absolute;
    top: 42%; left: 50%;
    transform: translate(-50%, -50%);
    width: 28in; height: 16in;
    background: radial-gradient(ellipse, rgba(200,146,30,0.10) 0%, transparent 55%);
  }

  /* ── gold border ── */
  .sign::before {
    content: '';
    position: absolute;
    inset: 0.27in;
    border: 2px solid rgba(200,146,30,0.30);
    pointer-events: none;
    z-index: 5;
  }

  /* ── main layout stack ── */
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    padding: 0.75in 1in 5.25in;
  }

  /* ── group wrappers ── */
  .top-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .brand-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .bottom-group {
    position: absolute;
    bottom: 1.1in;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* ── top tagline ── */
  .tagline-top {
    font-size: 0.54in;
    font-weight: 700;
    letter-spacing: 0.38em;
    text-transform: uppercase;
    color: rgba(200,146,30,0.75);
    margin-bottom: 0.15in;
  }

  /* ── logo ── */
  .logo {
    font-size: 4.0in;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #fff;
    line-height: 0.88;
    white-space: nowrap;
  }
  .logo span {
    color: #c8921e;
    text-shadow:
      0 0 0.22in rgba(200,146,30,1),
      0 0 0.5in rgba(200,146,30,0.55),
      0 0 0.9in rgba(200,146,30,0.25);
  }

  /* ── decorative rule under logo ── */
  .logo-rule {
    width: 22in;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, rgba(200,146,30,0.5) 15%, #c8921e 40%, #c8921e 60%, rgba(200,146,30,0.5) 85%, transparent 100%);
    margin-top: 0.3in;
    margin-bottom: 0.24in;
  }

  /* ── three-word tagline ── */
  .sub-text {
    font-size: 0.5in;
    font-weight: 700;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
  }

  /* ── headline slogan ── */
  .headline {
    font-size: 1.5in;
    font-weight: 900;
    line-height: 1;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-align: center;
    margin-top: 0.45in;
  }
  .headline em {
    color: #c8921e;
    font-style: normal;
    text-shadow:
      0 0 0.12in rgba(200,146,30,0.9),
      0 0 0.33in rgba(200,146,30,0.4);
  }

  /* ── CTA ── */
  .call-label {
    font-size: 0.42in;
    font-weight: 700;
    letter-spacing: 0.30em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.38);
    margin-bottom: 0.08in;
  }

  .phone {
    font-size: 2.25in;
    font-weight: 900;
    letter-spacing: 0.22em;
    color: #fff;
    line-height: 1;
    text-align: center;
    width: 100%;
    text-shadow: none;
  }

  @media print {
    body { background: none; padding: 0; display: block; height: auto; overflow: visible; }
    .sign { box-shadow: none; zoom: 1 !important; transform: none !important; }
  }

  @page {
    size: 30in 18in landscape;
    margin: 0;
  }
</style>
</head>
<body>

<div class="sign-wrap">
<div class="sign">
  <!-- background glow -->
  <div class="bg-glow">
    <div class="bg-glow-center"></div>
  </div>

  <div class="content">
    <!-- CENTER — brand -->
    <div class="brand-group">
      <div class="tagline-top">Permanent LED Lighting</div>
      <div class="logo">AFTER<span>GLO</span></div>
      <div class="logo-rule"></div>
      <div class="sub-text">Permanent · Programmable · Professional</div>
    </div>

    <!-- MIDDLE — slogan -->
    <div class="headline">Glow <em>Unleashed.</em></div>

    <!-- BOTTOM — CTA -->
    <div class="bottom-group">
      <div class="call-label">Call or Text for a Free Quote</div>
      <div class="phone">(385) 337-4144</div>
    </div>
  </div>
</div>
</div>

<script>
  (function() {
    var GAP = 32;
    var SW  = 30 * 96;
    var SH  = 18 * 96;
    function fit() {
      var wrap = document.querySelector('.sign-wrap');
      var s = Math.min(
        (window.innerWidth  - GAP) / (SW + 96),
        (window.innerHeight - GAP) / (SH + 96)
      );
      wrap.style.zoom = String(Math.min(s, 1));
    }
    fit();
    window.addEventListener('resize', fit);
  })();
</script>
</body>
</html>
