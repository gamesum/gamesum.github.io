<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #333;
  }
  .icon {
    width: 1024px;
    height: 1024px;
    background: #1a1a1e;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 0;
  }
  .text {
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-weight: 900;
    font-size: 480px;
    letter-spacing: -20px;
    line-height: 1;
  }
  .a {
    color: #ffffff;
  }
  .g {
    color: #c8962a;
  }
</style>
</head>
<body>
  <div class="icon">
    <span class="text"><span class="a">A</span><span class="g">G</span></span>
  </div>
</body>
</html>
